name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `./.tools/study doctor`
      render: text
  - type: input
    id: os
    attributes:
      label: OS and chip
      placeholder: macOS 15, Apple M2 / Ubuntu 24.04, x86_64
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal course material and names from logs and screenshots
          required: true
