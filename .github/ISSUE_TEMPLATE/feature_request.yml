name: Feature request
description: An idea for a new command, file type or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would help you study?
      description: The situation and what is missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work, e.g. a new slash command or a change to an existing one.
