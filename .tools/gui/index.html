<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Study</title>
<style>
/* Design "Violet": the 2026 product-UI look (Linear / Vercel style). A calm cool-neutral base,
   one expressive accent (violet), a tonal violet scale for mastery, and two signals: orange = due,
   red = mistake. All colours in OKLCH, one token set per theme. */
:root {
  --paper: oklch(98.4% 0.004 286); --surface: oklch(100% 0 0); --raised: oklch(100% 0 0);
  --ink: oklch(22% 0.02 285); --muted: oklch(52% 0.018 285); --faint: oklch(68% 0.014 285);
  --line: oklch(92.5% 0.007 286);
  --accent: oklch(54% 0.24 287); --accent-ink: oklch(99% 0 0); --accent-soft: oklch(95.5% 0.03 287);
  --due: oklch(70% 0.18 52); --due-text: oklch(50% 0.15 50); --due-ink: oklch(28% 0.07 52); --due-soft: oklch(96% 0.035 70);
  --bad: oklch(60% 0.21 22); --bad-soft: oklch(96% 0.025 22); --good: oklch(60% 0.15 155);
  /* mastery: 0 = neutral, then one violet hue getting deeper */
  --m0: oklch(96.2% 0.005 286); --m1: oklch(94% 0.035 290); --m2: oklch(88% 0.07 290);
  --m3: oklch(78.5% 0.12 289); --m4: oklch(63% 0.19 288); --m5: oklch(48% 0.22 287);
  --m0-ink: var(--ink); --m1-ink: var(--ink); --m2-ink: var(--ink); --m3-ink: oklch(22% 0.06 287);
  --m4-ink: oklch(99% 0 0); --m5-ink: oklch(99% 0 0);
  --shadow: 0 1px 2px oklch(22% 0.02 285 / .05), 0 8px 24px -8px oklch(22% 0.02 285 / .08);
  --glow: 0 0 0 1px oklch(54% 0.24 287 / .12), 0 10px 40px -12px oklch(54% 0.24 287 / .35);
  --head: "Inter Display", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --sans: Inter, "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: oklch(15.5% 0.012 286); --surface: oklch(19% 0.014 286); --raised: oklch(23% 0.016 286);
    --ink: oklch(96% 0.006 286); --muted: oklch(70% 0.015 286); --faint: oklch(52% 0.015 286);
    --line: oklch(28% 0.016 286);
    --accent: oklch(72% 0.17 288); --accent-ink: oklch(16% 0.02 286); --accent-soft: oklch(27% 0.06 288);
    --due: oklch(76% 0.16 60); --due-text: oklch(80% 0.14 65); --due-ink: oklch(22% 0.05 60); --due-soft: oklch(27% 0.05 60);
    --bad: oklch(70% 0.17 22); --bad-soft: oklch(26% 0.05 22); --good: oklch(74% 0.14 155);
    --m0: oklch(23% 0.012 286); --m1: oklch(27% 0.045 289); --m2: oklch(34% 0.09 289);
    --m3: oklch(44% 0.14 288); --m4: oklch(57% 0.18 288); --m5: oklch(76% 0.13 290);
    --m0-ink: var(--ink); --m1-ink: var(--ink); --m2-ink: var(--ink); --m3-ink: var(--ink);
    --m4-ink: oklch(99% 0 0); --m5-ink: oklch(16% 0.03 287);
    --shadow: 0 1px 2px oklch(0% 0 0 / .35); --glow: 0 0 0 1px oklch(72% 0.17 288 / .2), 0 10px 40px -12px oklch(72% 0.17 288 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: oklch(15.5% 0.012 286); --surface: oklch(19% 0.014 286); --raised: oklch(23% 0.016 286);
  --ink: oklch(96% 0.006 286); --muted: oklch(70% 0.015 286); --faint: oklch(52% 0.015 286);
  --line: oklch(28% 0.016 286);
  --accent: oklch(72% 0.17 288); --accent-ink: oklch(16% 0.02 286); --accent-soft: oklch(27% 0.06 288);
  --due: oklch(76% 0.16 60); --due-text: oklch(80% 0.14 65); --due-ink: oklch(22% 0.05 60); --due-soft: oklch(27% 0.05 60);
  --bad: oklch(70% 0.17 22); --bad-soft: oklch(26% 0.05 22); --good: oklch(74% 0.14 155);
  --m0: oklch(23% 0.012 286); --m1: oklch(27% 0.045 289); --m2: oklch(34% 0.09 289);
  --m3: oklch(44% 0.14 288); --m4: oklch(57% 0.18 288); --m5: oklch(76% 0.13 290);
  --m0-ink: var(--ink); --m1-ink: var(--ink); --m2-ink: var(--ink); --m3-ink: var(--ink);
  --m4-ink: oklch(99% 0 0); --m5-ink: oklch(16% 0.03 287);
  --shadow: 0 1px 2px oklch(0% 0 0 / .35); --glow: 0 0 0 1px oklch(72% 0.17 288 / .2), 0 10px 40px -12px oklch(72% 0.17 288 / .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { font-family: var(--head); font-weight: 650; margin: 0; letter-spacing: -.025em; }
body { -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
.muted { color: var(--muted); }
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100vh; }
.work { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.work > [hidden] { display: none !important; }
.work > .main, .work > .study { flex: 1; min-height: 0; }

/* ---------- modes: one job on screen at a time ---------- */
.modes { flex: none; display: flex; justify-content: center; padding: 12px 64px 12px 16px; border-bottom: 1px solid var(--line); }
.modes .seg { border-radius: 12px; background: var(--paper); padding: 3px; gap: 2px; }
.modes .seg button { min-height: 40px; padding: 0 22px; border-radius: 9px; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.modes .seg button.on { box-shadow: var(--shadow); color: var(--accent); }
.modes .live { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.session-notes { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; box-shadow: var(--shadow); }
.session-notes ul, .session-notes ol { margin: 4px 0 8px; padding-left: 20px; } .session-notes li { margin-bottom: 4px; }
.session-notes h4 { margin: 12px 0 4px; font-family: var(--head); font-size: 15px; font-weight: 650; }
.session-notes p { margin: 0 0 8px; }

/* ---------- left rail: subjects (Anki deck list + a mini course strip) ---------- */
.rail { border-right: 1px solid var(--line); padding: 20px 14px; overflow-y: auto; }
.brand { padding: 0 8px 18px; }
.brand h1 { font-size: 22px; }
.brand .date { color: var(--muted); font-size: 13px; }
.subj { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent;
  border-radius: 12px; padding: 10px 10px 11px; margin-bottom: 4px; }
.subj:hover { background: var(--surface); }
.subj.active { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow), inset 3px 0 0 var(--accent); }
.subj .row { display: flex; align-items: center; gap: 8px; }
.subj .name { font-weight: 600; flex: 1; }
.badge { font-size: 12px; font-weight: 600; border-radius: 99px; padding: 1px 8px; }
.badge.due { background: var(--due-soft); color: var(--due-text); }
.badge.ok { color: var(--good); }
.strip { display: flex; gap: 2px; margin: 8px 0 5px; }
.strip i { flex: 1; height: 6px; border-radius: 2px; background: var(--m0); max-width: 14px; }
.strip i.due { box-shadow: inset 0 -2px 0 var(--due); }
.subj .meta { font-size: 12px; color: var(--muted); }

/* ---------- main column ---------- */
.main { overflow-y: auto; padding: 28px 36px 60px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 20px; }
.head h2 { font-size: 32px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 13px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; color: var(--muted); background: var(--surface); }
.chip.hot { border-color: transparent; background: var(--due-soft); color: var(--due-text); font-weight: 600; }
section { margin-top: 30px; }
.sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.sec-head h3 { font-size: 20px; flex: 1; }

.btn { border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 8px 14px; font-weight: 600; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; padding: 10px 18px; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary { box-shadow: 0 1px 0 oklch(100% 0 0 / .18) inset, 0 6px 16px -6px var(--accent); }
.btn.small { padding: 5px 10px; font-size: 13px; }

/* Course map (Math Academy knowledge map + spatial canvas tiles) */
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; }
.focus { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
.focus h4 { margin: 0 0 6px; font-family: var(--head); font-size: 18px; font-weight: 650; letter-spacing: -.02em; }
.focus .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.focus .note { margin: 6px 0 12px; }
.focus .actions { display: flex; flex-wrap: wrap; gap: 8px; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 12px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--paper); }
.lv { display: inline-flex; gap: 2px; } .lv i { width: 14px; height: 8px; border-radius: 2px; background: var(--m0); }

/* Mistakes as flip cards (flashcard pattern) */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--bad);
  border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.card .t { font-size: 12px; font-weight: 600; color: var(--bad); }
.card .q { font-weight: 600; font-size: 14px; }
.card .hint { font-size: 12px; color: var(--faint); margin-top: auto; }
.card .ans { font-size: 13px; }
.card .why { font-size: 13px; background: var(--bad-soft); border-radius: 8px; padding: 6px 8px; }
.card .src { font-size: 12px; color: var(--muted); }
.card.fixed { border-left-color: var(--good); opacity: .75; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin: 12px 0 8px; }
.empty { color: var(--muted); padding: 14px 0; }

/* ---------- Study: the tutor gets the whole work area, in a readable column ---------- */
.tutor { --gutter: max(20px, calc((100% - 820px) / 2)); flex: 1 1 auto; min-width: 0; background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.tutor header { padding: 14px var(--gutter) 12px; border-bottom: 1px solid var(--line); }
.tutor header { display: flex; align-items: flex-start; gap: 10px; }
.tutor header > div { flex: 1; min-width: 0; }
.tutor header h3 { font-size: 18px; }
.newchat { border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 3px 9px; font-size: 12px; color: var(--muted); }
.newchat:hover { color: var(--accent); border-color: var(--accent); }
.tutor header .muted { font-size: 13px; }
.log { flex: 1; overflow-y: auto; padding: 20px var(--gutter); display: flex; flex-direction: column; gap: 12px; }
.bubble { max-width: 92%; padding: 11px 15px; border-radius: 14px; font-size: 15px; }
.bubble.tutor-msg { background: var(--paper); border: 1px solid var(--line); border-top-left-radius: 4px; overflow-wrap: anywhere; }
.bubble.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-top-right-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.error { background: var(--bad-soft); color: var(--bad); border: 1px solid transparent; }
.bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 20px; }
.bubble pre { background: var(--m0); border-radius: 8px; padding: 8px 10px; overflow-x: auto; font-size: 12.5px; margin: 6px 0; }
.bubble code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
.bubble :not(pre) > code { background: var(--m0); border-radius: 4px; padding: 0 4px; }
.bubble table { margin: 6px 0; font-size: 12.5px; border-radius: 8px; }
.bubble th, .bubble td { padding: 4px 8px; font-size: 12.5px; }
.bubble h4 { margin: 8px 0 4px; font-size: 14px; }
.activity { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.activity .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; transform: scale(.8); } }
.stopped { font-size: 12px; color: var(--faint); }
.btn.stop { background: var(--raised); color: var(--ink); border-color: var(--line); box-shadow: none; }
.cite { display: inline-block; font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 0 6px; margin: 2px 2px 0 0; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 var(--gutter) 10px; }
.quick button { border: 1px solid var(--line); background: var(--raised); border-radius: 99px; padding: 4px 12px; font-size: 13px; }
.quick button:hover { border-color: var(--accent); color: var(--accent); }
.compose { padding: 0 var(--gutter) 16px; }
.box { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--line); border-radius: 14px; background: var(--raised); padding: 8px; }
.box:focus-within { border-color: var(--accent); }
.box textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; color: var(--ink); font: inherit; font-size: 15px; min-height: 44px; max-height: 160px; padding: 4px 6px; }
.box .btn.primary { padding: 7px 14px; }
.box .btn:disabled { opacity: .45; cursor: not-allowed; }
.theme { position: fixed; right: 16px; top: 18px; z-index: 2; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; width: 32px; height: 32px; font-size: 14px; }

/* ---------- Plan: today's picks (board E) ---------- */
.today { max-width: 760px; }
.today .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 650; }
.today h2 { font-size: 32px; line-height: 1.12; margin: 4px 0 6px; text-wrap: balance; }
.today .sub { color: var(--muted); margin: 0 0 16px; max-width: 640px; }
.picks { display: grid; gap: 10px; margin-bottom: 16px; }
.pick { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; text-align: left; box-shadow: var(--shadow); }
.pick:hover:not(:disabled) { border-color: var(--accent); }
.pick:disabled { cursor: default; }
.pick .num { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--accent-soft); color: var(--accent); }
.pick.done { opacity: .62; } .pick.done .num { background: var(--good); color: var(--accent-ink); }
.pick .what { display: block; font-weight: 650; font-size: 16px; }
.pick .why { font-size: 13.5px; color: var(--muted); }
.pick .mins { font-size: 13px; color: var(--faint); white-space: nowrap; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 650; border-radius: 6px; padding: 0 6px; margin-right: 6px; background: var(--m0); color: var(--ink); border: 1px solid var(--line); }
.tag.kind { background: none; color: var(--accent); border-color: var(--accent-soft); }
.note-line { font-size: 13px; color: var(--muted); margin-top: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* prompts: exam dates and pausing */
.prompt { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); max-width: 760px; }
.prompt h4 { margin: 0 0 4px; font-family: var(--head); font-size: 17px; font-weight: 650; letter-spacing: -.015em; }
.prompt p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.prompt.warm { background: var(--due-soft); border-color: transparent; }
.exam-row { display: grid; grid-template-columns: 90px auto 1fr; gap: 8px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.exam-row:first-of-type { border-top: 0; }
.exam-row b { font-weight: 650; }
.exam-row .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.exam-row input { font: inherit; font-size: 14px; color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; min-height: 34px; }
.link-btn { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 4px 6px; }
.link-btn:hover { color: var(--accent); }

/* rhythm timeline (board D) */
.rhythm-head { font-size: 15px; color: var(--muted); margin: -4px 0 14px; }
.raxis { position: relative; height: 20px; margin: 0 108px 2px 90px; font-size: 12px; color: var(--muted); }
.raxis span { position: absolute; transform: translateX(-50%); white-space: nowrap; } .raxis span:first-child { transform: none; } .raxis span:last-child { transform: translateX(-100%); }
.rrow { display: grid; grid-template-columns: 72px minmax(0, 1fr) 92px; align-items: center; gap: 14px; width: 100%; min-height: 54px; padding: 0 12px;
  border: 0; border-radius: 12px; background: transparent; text-align: left; }
.rrow:hover, .rrow.on { background: var(--surface); box-shadow: var(--shadow); }
.rrow .code { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { position: relative; display: block; height: 28px; }
.track .base { position: absolute; left: 0; right: 0; top: 13px; height: 2px; background: var(--line); }
.track .fade { position: absolute; top: 9px; height: 10px; border-radius: 0 6px 6px 0; background: linear-gradient(90deg, var(--accent), transparent); opacity: .55; }
.track .sess { position: absolute; top: 6px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--paper); }
.rrow .count { text-align: right; font-size: 13px; line-height: 1.2; color: var(--muted); }
.rrow .count b { font-size: 16px; color: var(--ink); } .rrow .count b.hot { color: var(--due-text); }
.rrow.paused .track { opacity: .45; }

/* ---------- Study: strip | tutor | divider | map ---------- */
.study { display: flex; min-height: 0; min-width: 0; }
.topic-strip { flex: none; width: 236px; border-right: 1px solid var(--line); padding: 18px 14px; overflow-y: auto; background: var(--paper); }
.topic-strip h5 { margin: 14px 0 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650; }
.topic-strip h5:first-child { margin-top: 0; }
.topic-strip .cur { display: block; padding: 9px 11px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; line-height: 1.25; }
.topic-strip button.step { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 7px 9px; border: 0; border-radius: 9px; background: none; font-size: 13.5px; line-height: 1.25; }
.topic-strip button.step:hover { background: var(--surface); }
.topic-strip .sw { flex: none; width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--line); }
.topic-strip .none { font-size: 13px; color: var(--faint); padding: 4px 9px; }
.topic-pick { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.topic-pick select { font: inherit; font-size: 13px; color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; max-width: 220px; }
.newchat.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.quick .draw { border-color: var(--accent-soft); color: var(--accent); }
.quick button:disabled { opacity: .45; cursor: not-allowed; }
.quick .hint { font-size: 12px; color: var(--faint); align-self: center; }
.divider { flex: none; width: 9px; cursor: col-resize; background: var(--line); background-clip: content-box; padding: 0 4px; touch-action: none; }
.divider:hover, .divider:focus-visible, .divider.drag { background-color: var(--accent); outline: none; }
.mapside { flex: 1 1 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--paper); }
.mapside .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 650; }
.mapside .bar span { flex: 1; }
.mapside .cmap-scroll { flex: 1; max-height: none; border: 0; border-radius: 0; }

/* ---------- Reflect: what moved, connected map, replay (board F) ---------- */
.moved { margin-bottom: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; box-shadow: var(--shadow); }
.moved h4 { margin: 0 0 8px; font-family: var(--head); font-size: 15px; font-weight: 650; }
.moved ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.moved .v { display: inline-block; width: 18px; }
.moved .lv-ch { color: var(--muted); }
.warn { font-size: 13px; color: var(--due-text); margin: 6px 0; }
.map-tools { display: flex; align-items: center; gap: 6px; }
.zoom { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); font-weight: 700; }
.replay { display: flex; align-items: center; gap: 14px; margin: 14px 0 6px; }
.play { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.replay .rinfo { flex: 1; min-width: 0; }
.replay .rhead { font-family: var(--head); font-weight: 650; font-size: 17px; letter-spacing: -.015em; }
.replay .rsub { font-size: 13px; color: var(--muted); }
.replay input[type=range] { width: 100%; accent-color: var(--accent); margin: 4px 0 0; }
.rticks { position: relative; height: 10px; }
.rticks i { position: absolute; top: 1px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--accent); opacity: .7; }
.cmap-scroll { position: relative; overflow: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); max-height: 70vh; }
.cmap { position: relative; transform-origin: 0 0; }
.cmap svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.node { position: absolute; width: 176px; height: 50px; padding: 0 10px; border-radius: 10px; border: 1px solid transparent; display: flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 600; line-height: 1.2; text-align: left; transition: background .18s, color .18s; }
.node > span { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node:hover { border-color: var(--accent); }
.node.ns { background: transparent; border: 1px dashed var(--faint); color: var(--muted); font-weight: 500; }
.node.sel { box-shadow: 0 0 0 3px var(--accent); }
.node.cur { outline: 2px solid var(--accent); outline-offset: 2px; }
.node.due::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 3px; height: 3px; border-radius: 2px; background: var(--due); }
.node .mist { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--raised); }
.node .slip { flex: none; width: 9px; height: 9px; border-radius: 2px; background: var(--bad); box-shadow: 0 0 0 2px var(--raised); transform: rotate(45deg); }
.legend .fr { width: 40px; background: linear-gradient(90deg, var(--m0), var(--m4)); }

@media (max-width: 1100px) {
  .app { grid-template-columns: 220px minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100dvh; }
  .modes { padding: 8px 56px 8px 16px; justify-content: flex-start; }
  .modes .seg button { padding: 0 14px; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; display: flex; gap: 8px; overflow-x: auto; padding-right: 56px; }
  .brand { display: none; }
  #subjects { display: flex; gap: 8px; }
  .subj { width: 170px; flex: none; margin: 0; }
  .main { padding: 20px 16px 40px; }
  .head h2 { font-size: 28px; }
  .pick { grid-template-columns: 32px minmax(0, 1fr); } .pick .mins { display: none; }
  .rrow { grid-template-columns: 44px minmax(0, 1fr) 64px; gap: 8px; padding: 0 4px; }
  .raxis { margin: 0 72px 4px 52px; }
  .exam-row { grid-template-columns: 1fr; }
  .today h2 { font-size: 26px; }
  .study { flex-direction: column; } .topic-strip { display: none !important; }
  .divider, .mapside { display: none !important; } .tutor { flex: 1 1 auto !important; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<button class="theme" id="theme" title="Light / dark">◐</button>
<div class="app">
  <nav class="rail">
    <div class="brand"><h1>My Study</h1><div class="date" id="today"></div></div>
    <div id="subjects"></div>
  </nav>

  <div class="work">
  <nav class="modes" aria-label="Mode"><div class="seg" id="modes">
    <button data-view="plan">Plan</button>
    <button data-view="study">Study</button>
    <button data-view="reflect">Reflect</button>
  </div></nav>

  <main class="main" id="view-plan">
    <div class="today" id="todayPlan"></div>
    <div id="prompts"></div>
    <section>
      <div class="sec-head"><h3>Your rhythm</h3></div>
      <div id="rhythm"></div>
    </section>
    <section>
      <div class="head"><h2 id="title">Loading…</h2><div class="chips" id="facts"></div></div>
      <div class="sec-head"><h3>Mistakes to fix</h3><span class="muted" id="mistakeCount"></span></div>
      <div id="mistakes"></div>
    </section>
  </main>

  <section class="study" id="view-study" aria-label="Study" hidden>
    <aside class="topic-strip" id="topicStrip" aria-label="Where this topic sits" hidden></aside>
    <div class="tutor" id="tutor">
      <header><div><h3>Tutor</h3><div class="muted" id="tutorSub">Answers come from your lectures.</div></div>
        <label class="topic-pick">Topic <select id="topicSel"></select></label>
        <button class="newchat" id="mapToggle" title="Show the course map beside the chat">Map</button>
        <button class="newchat" id="newChat" title="Start a fresh conversation">New chat</button></header>
      <div class="log" id="log"></div>
      <div class="quick" id="quick">
        <button data-cmd="today">Today</button><button data-cmd="review">Review</button>
        <button data-cmd="quiz">Quiz</button><button data-cmd="status">Status</button>
        <span id="drawBtns"></span>
      </div>
      <div class="compose"><div class="box">
        <textarea id="input" placeholder="Ask your tutor… (Enter to send, Shift+Enter for a new line)" rows="2"></textarea>
        <button class="btn primary" id="send">Send</button>
      </div></div>
    </div>
    <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize the tutor" tabindex="0" hidden></div>
    <div class="mapside" id="mapSide" hidden></div>
  </section>

  <main class="main" id="view-reflect" hidden>
    <div class="head"><h2 id="reflectTitle">Reflect</h2></div>
    <div id="moved"></div>
    <div id="notes"></div>
    <section>
      <div class="sec-head"><h3>Course map</h3>
        <span class="map-tools" id="mapTools"></span>
        <div class="seg" id="mapMode"><button data-mode="map" class="on">Map</button><button data-mode="list">List</button></div></div>
      <div id="replay"></div>
      <div class="legend">
        <span><i class="fr"></i>fresher in memory</span>
        <span><i style="border:1px dashed var(--faint)"></i>not started</span>
        <span><i style="background:var(--due);height:4px"></i>review due</span>
        <span><i style="background:var(--bad);border-radius:50%;width:9px;height:9px"></i>open mistake</span>
        <span><i style="background:var(--bad);width:9px;height:9px;transform:rotate(45deg)"></i>slips when drawn</span>
        <span>→ needed before</span>
      </div>
      <div id="warnings"></div>
      <div id="map"></div>
      <div id="focus"></div>
    </section>
  </main>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get('t');
const api = path => fetch(`${path}?t=${encodeURIComponent(token)}`).then(r => r.json());
const post = (path, body) => fetch(`${path}?t=${encodeURIComponent(token)}`, { method: 'POST',
  headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LEVEL = ['not started', 'seen', 'shaky', 'ok', 'solid', 'mastered'];
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let state = { list: null, current: null, detail: null, mode: 'map', sel: null, flipped: new Set(), view: 'plan',
  zoom: +(store.get('study-zoom') || 1), day: null, playing: null, mapOpen: store.get('study-map-open') === '1' };

function setView(view) {
  state.view = view;
  for (const v of ['plan', 'study', 'reflect']) document.getElementById(`view-${v}`).hidden = v !== view;
  document.querySelectorAll('#modes button').forEach(b => {
    const on = b.dataset.view === view;
    b.classList.toggle('on', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  store.set('study-view', view);
  if (view === 'study') { layoutStudy(); logEl.scrollTop = logEl.scrollHeight; input.focus(); }
}

const fmtDay = (iso, opts = { day: 'numeric', month: 'short' }) => new Date(iso + 'T12:00').toLocaleDateString(undefined, opts);
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
function examText(e) {
  if (e.state !== 'date') return e.label;
  return e.days === 0 ? 'exam today' : `exam in ${e.days} days`;
}
const ago = d => d === 0 ? 'today' : d === 1 ? 'yesterday' : `${d} days ago`;
const norm = s => String(s).toLowerCase().replace(/[`'"()]/g, '').trim();
// Mistake topics are short ("Multiplicities"); progress topics are longer. Match by prefix either way.
const sameTopic = (a, b) => { a = norm(a); b = norm(b); return !!a && !!b && (a.startsWith(b) || b.startsWith(a)); };
const mistakesFor = (d, t) => d.mistakes.filter(m => !m.fixed && sameTopic(m.topic, t.topic));
const started = t => t.level > 0 || !!t.last;
const KIND = { review: 'review', lesson: 'new topic', drawing: 'drawing' };
const prompts = {
  review: (s, t) => `Review only ${t} in ${s}, 3 questions, following the review rules`,
  lesson: (s, t) => `Learn ${t} in ${s}`,
  drawing: (s, t) => `Give me a drawing task on ${t} in ${s}`,
  saved: (s, t) => `Grade my drawing on ${t}`,
};

// ---------- the rail ----------
function renderList() {
  const { today, subjects } = state.list;
  document.getElementById('today').textContent = fmtDay(today, { weekday: 'long', day: 'numeric', month: 'long' });
  const sorted = [...subjects].sort((a, b) => b.due - a.due || a.name.localeCompare(b.name));
  document.getElementById('subjects').innerHTML = sorted.map(s => `
    <button class="subj ${s.name === state.current ? 'active' : ''}" data-name="${esc(s.name)}">
      <div class="row"><span class="name">${esc(s.name)}</span>
        ${s.paused ? '<span class="badge">paused</span>' : s.due ? `<span class="badge due">${s.due} due</span>` : s.topics ? '<span class="badge ok">✓</span>' : ''}</div>
      <div class="strip">${(s.strip || []).map(t => `<i class="${t.due ? 'due' : ''}" style="background:var(--m${t.level})"></i>`).join('')}</div>
      <div class="meta">${s.started}/${s.topics} started${s.awayDays !== null ? ` · ${ago(s.awayDays)}` : ''}</div>
    </button>`).join('') || '<div class="empty">No subjects yet. Run <code>study new "Subject"</code>.</div>';
}

// ---------- Plan ----------
function renderToday() {
  const { plan, rhythm } = state.list, el = document.getElementById('todayPlan');
  const picks = plan.picks, left = picks.filter(p => !p.done), paused = state.list.subjects.filter(s => s.paused);
  const pausedNote = paused.length ? `<div class="note-line">Reviews paused for ${paused.map(s => esc(s.name)).join(', ')}, so ${paused.length > 1 ? 'they stay' : 'it stays'} out of the plan.</div>` : '';
  if (!picks.length) {
    el.innerHTML = `<div class="kicker">Today</div><h2>Nothing to plan today</h2>
      <p class="sub">No reviews are due and every topic is started. Add materials with <b>/ingest</b>, or ask the tutor anything.</p>${pausedNote}`;
    return;
  }
  const head = !left.length ? 'Done for today'
    : rhythm.overdue ? `${rhythm.overdue} topic${rhythm.overdue === 1 ? ' is' : 's are'} overdue. ${left.length === 1 ? 'This one is' : `These ${left.length} are`} enough today.`
    : `Nothing overdue. ${left.length} short pick${left.length === 1 ? '' : 's'} for today.`;
  const sub = !left.length ? `All ${picks.length} picks finished. Anything more is a bonus. Check Reflect for what moved.`
    : 'Picked from your open mistakes, exam dates and what has waited longest. The rest can wait without you falling behind.';
  el.innerHTML = `<div class="kicker">Today · about ${left.length * 5} minutes</div><h2>${esc(head)}</h2><p class="sub">${esc(sub)}</p>
    <div class="picks">${picks.map((p, i) => `
      <button class="pick ${p.done ? 'done' : ''}" data-pick="${i}" ${p.done ? 'disabled' : ''}>
        <span class="num">${p.done ? '✓' : i + 1}</span>
        <span><span class="what">${esc(p.topic)}</span>
          <span class="why"><span class="tag">${esc(p.subject)}</span><span class="tag kind">${esc(KIND[p.kind] ?? p.kind)}</span>${esc(p.reason)}</span></span>
        <span class="mins">${p.done ? 'done' : '5 min'}</span>
      </button>`).join('')}</div>
    ${left.length ? `<button class="btn primary" data-pick="${picks.indexOf(left[0])}">Start the ${left.length * 5} minutes</button>` : ''}
    ${pausedNote}`;
}

function renderPrompts() {
  const { prompts: pr, subjects } = state.list, out = [];
  if (pr.exam.length) out.push(`<div class="prompt"><h4>When are your exams?</h4>
    <p>The planner ranks topics by how close each exam is. Without a date, every subject counts the same.</p>
    ${pr.exam.map(x => `<div class="exam-row"><b>${esc(x.subject)}</b>
      <input type="date" aria-label="${esc(x.subject)} exam date" data-exam-date="${esc(x.subject)}">
      <span class="acts"><button class="btn small" data-exam-save="${esc(x.subject)}">Save</button>
        <button class="btn small" data-exam="${esc(x.subject)}" data-value="unknown">Unknown</button>
        <button class="btn small" data-exam="${esc(x.subject)}" data-value="none">No exam</button>
        <button class="link-btn" data-dismiss="${esc(x.key)}">Not now</button></span></div>`).join('')}
    ${pr.exam.some(x => x.past) ? '<p style="margin:8px 0 0">The saved date has passed for some subjects. Add the next one (a resit) or choose No exam.</p>' : ''}</div>`);
  for (const x of pr.pause) out.push(`<div class="prompt warm"><h4>${esc(x.subject)} has no exam and ${x.due} overdue reviews</h4>
    <p>They add to the pile without helping your grade. Pausing keeps them out of today's plan, /today and /review until you resume.</p>
    <span class="acts" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small primary" data-reviews="${esc(x.subject)}" data-action="pause">Pause ${esc(x.subject)} reviews</button>
      <button class="link-btn" data-dismiss="${esc(x.key)}">Not now</button></span></div>`);
  for (const s of subjects.filter(s => s.paused)) out.push(`<div class="prompt"><h4>${esc(s.name)} reviews are paused${s.pausedSince ? ` since ${esc(fmtDay(s.pausedSince))}` : ''}</h4>
    <p>Resuming counts overdue days from the resume date, so ${esc(s.name)} won't flood the plan.</p>
    <button class="btn small" data-reviews="${esc(s.name)}" data-action="resume">Resume ${esc(s.name)} reviews</button></div>`);
  document.getElementById('prompts').innerHTML = out.join('');
}

function renderRhythm() {
  const r = state.list.rhythm, el = document.getElementById('rhythm');
  if (!r.rows.length) { el.innerHTML = '<div class="empty">Your sessions show up here once you start studying.</div>'; return; }
  const pct = day => +(day / (r.days - 1) * 100).toFixed(2);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => Math.round(f * (r.days - 1)));
  el.innerHTML = `<div class="rhythm-head">${r.overdue} of your ${r.started} started topics are overdue · sessions on ${r.sessionDays} of the last ${r.days} days.
      Each dot is a session; the fading band is the time since you last opened that subject.</div>
    <div class="raxis">${ticks.map(t => `<span style="left:${pct(t)}%">${t === r.days - 1 ? 'Today' : esc(fmtDay(addDays(r.start, t)))}</span>`).join('')}</div>
    ${r.rows.map(row => {
      const lastIdx = row.last ? Math.max(daysBetween(r.start, row.last), 0) : 0;
      return `<button class="rrow ${row.name === state.current ? 'on' : ''} ${row.paused ? 'paused' : ''}" data-name="${esc(row.name)}"
        aria-label="${esc(row.name)}: ${row.days.length} session days in this window, ${row.due} of ${row.started} started topics overdue${row.paused ? ', reviews paused' : ''}">
        <span class="code">${esc(row.name)}</span>
        <span class="track"><span class="base"></span>
          ${row.last ? `<span class="fade" style="left:${pct(lastIdx)}%;width:${(100 - pct(lastIdx)).toFixed(2)}%"></span>` : ''}
          ${row.days.map(d => `<span class="sess" style="left:${pct(d)}%"></span>`).join('')}</span>
        <span class="count">${row.paused ? 'paused' : `<b class="${row.due ? 'hot' : ''}">${row.due}</b> of ${row.started}<br>overdue`}</span>
      </button>`; }).join('')}`;
}

function renderMistakes(d) {
  const open = d.mistakes.filter(m => !m.fixed), fixed = d.mistakes.filter(m => m.fixed);
  document.getElementById('mistakeCount').textContent = open.length ? `${open.length} open` : '';
  const card = (m, i, isFixed) => {
    const shown = isFixed || state.flipped.has(i);
    return `<button class="card ${isFixed ? 'fixed' : ''}" ${isFixed ? '' : `data-flip="${i}"`}>
      <span class="t">${esc(m.topic)} · ${esc(m.date)}</span>
      <span class="q">${esc(m.question)}</span>
      ${shown ? `${m.answer ? `<span class="ans muted">You said: ${esc(m.answer)}</span>` : ''}
        ${m.why ? `<span class="why">${esc(m.why)}</span>` : ''}${m.source ? `<span class="src">${esc(m.source)}</span>` : ''}`
        : '<span class="hint">Answer it in your head, then tap to check</span>'}
    </button>`;
  };
  document.getElementById('mistakes').innerHTML = !d.mistakes.length ? '<div class="empty">No mistakes logged yet.</div>' :
    (open.length ? `<div class="cards">${open.map((m, i) => card(m, i, false)).join('')}</div>` : '<div class="empty">All mistakes fixed ✅</div>') +
    (fixed.length ? `<details><summary>${fixed.length} fixed</summary><div class="cards">${fixed.map((m, i) => card(m, i, true)).join('')}</div></details>` : '');
}

// ---------- the current topic (Study) ----------
const topicKey = s => `study-topic-${s}`;
function currentTopic(d = state.detail) {
  if (!d) return null;
  const name = store.get(topicKey(d.name));
  return d.topics.find(t => t.topic === name) ?? null;
}
function setTopic(subject, topic) { store.set(topicKey(subject), topic ?? ''); }
const needsOf = (d, i) => d.links.filter(([, b]) => b === i).map(([a]) => a);
const unlocksOf = (d, i) => d.links.filter(([a]) => a === i).map(([, b]) => b);
const swatch = t => `<i class="sw" style="${t.fresh === null ? '' : `background:color-mix(in oklch, var(--m4) ${Math.round(t.fresh * 100)}%, var(--m0))`}"></i>`;

function renderStudyBits() {
  const d = state.detail, t = currentTopic();
  const sel = document.getElementById('topicSel');
  sel.innerHTML = `<option value="">Choose a topic…</option>` +
    d.topics.map(x => `<option ${t && x.topic === t.topic ? 'selected' : ''}>${esc(x.topic)}</option>`).join('');
  const strip = document.getElementById('topicStrip');
  strip.hidden = !d.links.length;
  if (d.links.length) {
    const i = t ? d.topics.indexOf(t) : -1;
    const list = ids => ids.length ? ids.map(k => `<button class="step" data-topic="${esc(d.topics[k].topic)}">${swatch(d.topics[k])}<span>${esc(d.topics[k].topic)}</span></button>`).join('')
      : '<div class="none">nothing</div>';
    strip.innerHTML = i < 0 ? '<h5>This topic</h5><div class="none">Choose a topic to see what it needs and unlocks.</div>'
      : `<h5>Needs</h5>${list(needsOf(d, i))}<h5>This topic</h5><span class="cur">${esc(t.topic)}</span>
         <div class="none">${esc(LEVEL[t.level] ?? '')}${t.fresh !== null ? ` · ${Math.round(t.fresh * 100)}% fresh` : ''}</div>
         <h5>Unlocks</h5>${list(unlocksOf(d, i))}`;
  }
  const running = !!chatFor(d.name).running, why = t ? '' : 'Choose a topic';
  document.getElementById('drawBtns').innerHTML = d.diagrams ? `
    <button class="draw" data-draw="drawing" ${t && !running ? '' : 'disabled'} title="${why || 'A drawing task in draw.io'}">Draw it</button>
    <button class="draw" data-draw="saved" ${t && !running ? '' : 'disabled'} title="${why || 'Ask the tutor to grade the saved diagram'}">I've saved it</button>
    ${t ? '' : '<span class="hint">Choose a topic</span>'}` : '';
  document.getElementById('mapToggle').classList.toggle('on', state.mapOpen);
  if (state.mapOpen) renderMapInto(document.getElementById('mapSide'), d, true);
  layoutStudy();
}

function layoutStudy() {
  const open = state.mapOpen, tutor = document.getElementById('tutor');
  document.getElementById('divider').hidden = !open;
  document.getElementById('mapSide').hidden = !open;
  if (!open) { tutor.style.flex = ''; return; }
  const total = document.getElementById('view-study').clientWidth || window.innerWidth;
  const w = Math.min(Math.max(+(store.get('study-tutor-w') || 0) || total * 0.55, 300), total * 0.7);
  tutor.style.flex = `0 0 ${Math.round(w)}px`;
}

// ---------- Reflect ----------
function renderNotes(d) {
  const n = d.notes;
  document.getElementById('reflectTitle').textContent = n
    ? (n.date === state.list.today ? `${d.name} · today` : `${d.name} · last session ${fmtDay(n.date, { day: 'numeric', month: 'long' })}`)
    : `${d.name} · reflect`;
  document.getElementById('notes').innerHTML = n
    ? `<div class="session-notes">${md(n.text)}</div>`
    : `<div class="empty">No session notes for ${esc(d.name)} yet. They appear here after your first session.</div>`;
  const mv = d.moved, V = { correct: '✅', partly: '⚠️', wrong: '❌' };
  document.getElementById('moved').innerHTML = (mv && mv.items.length ? `<div class="moved">
      <h4>What moved · ${mv.date === state.list.today ? 'today' : esc(fmtDay(mv.date, { day: 'numeric', month: 'long' }))}</h4>
      <ul>${mv.items.map(x => `<li><span class="v">${V[x.verdict] ?? ''}</span><b>${esc(x.topic)}</b>
        <span class="lv-ch">${x.before === null ? `new, level ${x.after}` : x.before === x.after ? `stays at level ${x.after}` : `level ${x.before} → ${x.after}`}
        · ${esc(x.kinds.join(', '))}</span></li>`).join('')}</ul></div>` : '') +
    (d.unlogged ? `<div class="warn">${d.unlogged} topic${d.unlogged === 1 ? ' was' : 's were'} studied without an entry in the event log, so they aren't in What moved or the replay. The tutor logs with <code>study log</code> when it saves progress.</div>` : '');
}

// Freshness per topic on `day` (null = today, from progress.md). Earlier days come from events.jsonl.
function freshAt(d, day) {
  if (!day || !d.replay) return d.topics.map(t => t.fresh);
  const lastBy = {};
  for (const e of d.replay) if (e.day <= day) lastBy[e.i] = e;
  return d.topics.map((t, i) => {
    const e = lastBy[i];
    return e && e.interval ? Math.pow(2, -daysBetween(e.day, day) / (4 * e.interval)) : null;
  });
}

const NW = 176, NH = 50, GX = 212, GY = 62, PAD = 16;
function mapLayout(d) {
  const n = d.topics.length, pos = [];
  if (d.links.length) {
    const rows = {};
    d.topics.forEach((t, i) => { const c = d.depths[i]; rows[c] = (rows[c] ?? -1) + 1; pos[i] = { c, r: rows[c] }; });
  } else {
    const per = Math.max(6, Math.ceil(n / 5));
    d.topics.forEach((t, i) => pos[i] = { c: Math.floor(i / per), r: i % per });
  }
  const pts = pos.map(p => ({ x: PAD + p.c * GX, y: PAD + p.r * GY }));
  const w = Math.max(...pts.map(p => p.x)) + NW + PAD, h = Math.max(...pts.map(p => p.y)) + NH + PAD;
  return { pts, w, h };
}

function renderMapInto(el, d, side) {
  if (!d.topics.length) { el.innerHTML = '<div class="empty">No topics yet.</div>'; return; }
  const { pts, w, h } = mapLayout(d), fr = freshAt(d, state.day), cur = currentTopic(d), z = state.zoom, today = !state.day;
  const edges = d.links.map(([a, b]) => {
    const p = pts[a], q = pts[b], x1 = p.x + NW, y1 = p.y + NH / 2, x2 = q.x - 4, y2 = q.y + NH / 2, c = Math.max((x2 - x1) / 2, 30);
    const lit = (fr[a] ?? 0) >= .5 && (fr[b] ?? 0) >= .5;
    return `<path d="M ${x1} ${y1} C ${x1 + c} ${y1}, ${x2 - c} ${y2}, ${x2} ${y2}" style="fill:none;stroke:${lit ? 'var(--accent)' : 'var(--faint)'};stroke-width:1.5;opacity:${lit ? .9 : .45}" marker-end="url(#ah${lit ? 'L' : ''}${side ? 's' : ''})"/>`;
  }).join('');
  const nodes = d.topics.map((t, i) => {
    const f = fr[i], ns = f === null || f === undefined, pc = ns ? 0 : Math.round(f * 100);
    const ms = today && mistakesFor(d, t).length;
    const style = `left:${pts[i].x}px;top:${pts[i].y}px;` + (ns ? '' :
      `background:color-mix(in oklch, var(--m4) ${pc}%, var(--m0));color:${pc > 55 ? 'var(--m4-ink)' : 'var(--ink)'};`);
    return `<button class="node ${ns ? 'ns' : ''} ${today && t.overdue !== null && !ns ? 'due' : ''} ${state.sel === i && !side ? 'sel' : ''} ${cur === t ? 'cur' : ''}"
      style="${style}" data-node="${i}" title="${esc(t.topic)}"
      aria-label="${esc(t.topic)}, ${ns ? 'not studied yet' : `${pc} percent fresh`}${t.slip ? ', slips when drawn' : ''}${ms ? ', open mistake' : ''}">
      <span>${esc(t.topic)}</span>${ms ? '<i class="mist" title="open mistake"></i>' : ''}${t.slip && today ? '<i class="slip" title="Right in chat, wrong on your diagram"></i>' : ''}</button>`;
  }).join('');
  const defs = `<defs>${['', 'L'].map(k => `<marker id="ah${k}${side ? 's' : ''}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" style="fill:${k ? 'var(--accent)' : 'var(--faint)'}"/></marker>`).join('')}</defs>`;
  const map = `<div class="cmap-scroll"><div style="width:${w * z}px;height:${h * z}px"><div class="cmap" style="width:${w}px;height:${h}px;transform:scale(${z})">
    <svg width="${w}" height="${h}" aria-hidden="true">${defs}${edges}</svg>${nodes}</div></div></div>`;
  el.innerHTML = side ? `<div class="bar"><span>${esc(d.name)} map</span><button class="zoom" data-zoom="-1" aria-label="Zoom out">−</button>
    <button class="zoom" data-zoom="1" aria-label="Zoom in">+</button><button class="zoom" data-map-close aria-label="Close the map">×</button></div>${map}` : map;
}

function renderReplay(d) {
  const el = document.getElementById('replay');
  if (!d.replay || !d.replay.length || state.mode !== 'map') { el.innerHTML = ''; return; }
  const first = d.replay.reduce((m, e) => e.day < m ? e.day : m, state.list.today), span = Math.max(daysBetween(first, state.list.today), 1);
  const idx = state.day ? daysBetween(first, state.day) : span;
  const fr = freshAt(d, state.day), seen = fr.filter(f => f !== null).length, warm = fr.filter(f => f !== null && f >= .5).length;
  const days = [...new Set(d.replay.map(e => e.day))];
  el.innerHTML = `<div class="replay">
    <button class="play" data-play aria-label="${state.playing ? 'Pause the replay' : 'Replay your semester'}">${state.playing
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>'}</button>
    <div class="rinfo"><div class="rhead">${warm} of the ${seen} topics you've touched ${state.day ? 'were' : 'are'} still fresh</div>

      <input type="range" min="0" max="${span}" value="${idx}" aria-label="Day" data-scrub="${esc(first)}">
      <div class="rticks">${days.map(x => `<i style="left:${(daysBetween(first, x) / span * 100).toFixed(2)}%"></i>`).join('')}</div></div></div>`;
}

function renderMap(d) {

async function openSubject(name, keep) {

// ---------- replay ----------
function stopPlay() { if (state.playing) { clearInterval(state.playing); state.playing = null; } }
function togglePlay() {
  const d = state.detail; if (!d?.replay) return;
  if (state.playing) { stopPlay(); renderReplay(d); return; }
  const first = d.replay.reduce((m, e) => e.day < m ? e.day : m, state.list.today);
  if (!state.day) state.day = first;
  state.playing = setInterval(() => {
    const next = addDays(state.day, 1);
    if (next >= state.list.today) { state.day = null; stopPlay(); } else state.day = next;
    renderMap(d);
  }, 220);
  renderMap(d);
}

// ---------- chat with the tutor (through the agent adapter on the server) ----------
const input = document.getElementById('input'), sendBtn = document.getElementById('send'), logEl = document.getElementById('log');
const chats = {};  // subject -> { sessionId, messages: [{role, text, tools, error, stopped}], running, runId }
const chatFor = name => chats[name] ??= (() => {
  let saved = null; try { saved = JSON.parse(localStorage.getItem(`study-chat-${name}`)); } catch {}
  return { sessionId: saved?.sessionId ?? null, messages: saved?.messages ?? [], running: false, runId: null };
})();
const saveChat = name => { const c = chats[name]; try {
  localStorage.setItem(`study-chat-${name}`, JSON.stringify({ sessionId: c.sessionId, messages: c.messages.slice(-60) })); } catch {} };

// Small, safe Markdown: escape first, then add formatting. Citations like (Lecture3.pdf p.12) become chips.
const CITE = /\(([^()\n]{2,140}?(?:\.pdf|\.pptx?|\.mp4|\.docx?|\.md|\[\d{1,2}:\d{2}(?::\d{2})?\]|\bp\.\s?\d+|\bslide\s\d+)[^()\n]{0,60})\)/gi;
function inline(t) {
  return t.replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, '$1<i>$2</i>')
    .replace(CITE, (m, c) => `<span class="cite">${c}</span>`);
}
function md(src) {
  const out = [], lines = esc(src).split('\n');
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^```/.test(l)) { const code = []; while (++i < lines.length && !/^```/.test(lines[i])) code.push(lines[i]);
      out.push(`<pre><code>${code.join('\n')}</code></pre>`); continue; }
    if (/^\s*\|/.test(l)) { const rows = []; for (; i < lines.length && /^\s*\|/.test(lines[i]); i++) rows.push(lines[i]); i--;
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table><thead><tr>${cells(body[0]).map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${
        body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`); continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) { const ordered = /^\s*\d+\./.test(l), items = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i]); i++) items.push(inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ''))); i--;
      const tag = ordered ? 'ol' : 'ul'; out.push(`<${tag}>${items.map(x => `<li>${x}</li>`).join('')}</${tag}>`); continue; }
    if (/^#{1,6}\s/.test(l)) { out.push(`<h4>${inline(l.replace(/^#+\s/, ''))}</h4>`); continue; }
    if (!l.trim()) continue;
    const para = [l]; while (i + 1 < lines.length && lines[i + 1].trim() && !/^(```|\s*\||\s*([-*]|\d+\.)\s|#{1,6}\s)/.test(lines[i + 1])) para.push(lines[++i]);
    out.push(`<p>${inline(para.join('<br>'))}</p>`);
  }
  return out.join('');
}

function renderChat() {
  const name = state.current, c = name ? chatFor(name) : null;
  const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 60;
  const welcome = `<div class="bubble tutor-msg">Pick something from <b>Plan</b>, choose a topic above, or just ask.
    I answer from your own lectures and show where, like <span class="cite">Wykład 2 [00:20:02]</span>.</div>`;
  const ready = state.list?.agentReady !== false ? '' :
    `<div class="bubble error">Can't find <b>${esc(state.list?.agent)}</b> on this computer. Install Claude Code and sign in, then reopen <code>study gui</code>. Plan and Reflect still work from your files.</div>`;
  logEl.innerHTML = ready + (!c || !c.messages.length ? welcome : c.messages.map(m => {
    if (m.role === 'me') return `<div class="bubble me">${esc(m.text)}</div>`;
    const busy = c.running && m === c.messages[c.messages.length - 1];
    return (m.text ? `<div class="bubble tutor-msg">${md(m.text)}</div>` : '') +
      (m.error ? `<div class="bubble error">${esc(m.error)}</div>` : '') +
      (busy ? `<div class="activity"><span class="pulse"></span>${esc(m.tools?.at(-1) ?? 'Thinking')}…</div>` : '') +
      (m.stopped ? '<div class="stopped">Stopped.</div>' : '');
  }).join(''));
  if (atBottom || c?.running) logEl.scrollTop = logEl.scrollHeight;
  const running = !!c?.running;
  sendBtn.textContent = running ? 'Stop' : 'Send';
  sendBtn.classList.toggle('stop', running);
  document.querySelectorAll('[data-pick], [data-study], [data-gen-links], #quick button').forEach(b => {
    if (!b.classList.contains('done')) b.disabled = running;
  });
  const study = document.querySelector('#modes [data-view="study"]');
  study.querySelector('.live')?.remove();
  if (running) study.insertAdjacentHTML('beforeend', '<span class="live" title="The tutor is working"></span>');
  document.querySelectorAll('[data-draw]').forEach(b => { b.disabled ||= !currentTopic(); });
}

async function send(text) {
  const name = state.current; if (!name) return;
  const c = chatFor(name); text = text.trim();
  if (!text || c.running) return;
  input.value = '';
  const reply = { role: 'tutor', text: '', tools: [] };
  c.messages.push({ role: 'me', text }, reply);
  c.running = true; renderChat();
  try {
    const res = await fetch(`/api/chat?t=${encodeURIComponent(token)}`, { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: text, subject: name, sessionId: c.sessionId }) });
    if (!res.ok) { reply.error = (await res.json().catch(() => ({}))).error ?? `Error ${res.status}`; return; }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let k; while ((k = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, k); buf = buf.slice(k + 2);
        if (!chunk.startsWith('data: ')) continue;
        const ev = JSON.parse(chunk.slice(6));
        if (ev.type === 'start') c.runId = ev.runId;
        else if (ev.type === 'session') c.sessionId = ev.sessionId;
        else if (ev.type === 'text') reply.text += ev.text;
        else if (ev.type === 'tool') reply.tools.push(ev.label);
        else if (ev.type === 'error') reply.error = ev.message;
        else if (ev.type === 'done') { if (ev.sessionId) c.sessionId = ev.sessionId; if (ev.stopped) reply.stopped = true; }
        if (name === state.current) renderChat();
      }
    }
  } catch (err) {
    reply.error = `Lost the connection to study gui (${err.message}). Is it still running?`;
  } finally {
    c.running = false; c.runId = null; delete reply.tools;
    saveChat(name);
    if (name === state.current) renderChat();
    reload();  // the tutor updated progress.md / mistakes.md / events.jsonl: show it
  }
}

async function stop() {
  const c = state.current && chatFor(state.current);
  if (c?.runId) await fetch(`/api/chat/stop?t=${encodeURIComponent(token)}`, { method: 'POST',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ runId: c.runId }) });
}

  if (pick) { const p = state.list.plan.picks[+pick.dataset.pick]; if (p && !p.done) startStudy(p.subject, p.topic, p.prompt); return; }
  const row = t.closest('.rrow'); if (row) { openSubject(row.dataset.name); return; }
  const save = t.closest('[data-exam-save]');
  if (save) { const s = save.dataset.examSave, v = document.querySelector(`[data-exam-date="${CSS.escape(s)}"]`).value;
    if (!v) { alertLine(`Pick a date for ${s} first, or choose Unknown.`); return; }
    write('/api/exam', { subject: s, value: v }); return; }
  const ex = t.closest('[data-exam]'); if (ex) { write('/api/exam', { subject: ex.dataset.exam, value: ex.dataset.value }); return; }
  const rv = t.closest('[data-reviews]'); if (rv) { write('/api/reviews', { subject: rv.dataset.reviews, action: rv.dataset.action }); return; }
  const dm = t.closest('[data-dismiss]'); if (dm) { write('/api/dismiss', { key: dm.dataset.dismiss }); return; }
  if (t.closest('[data-close]')) { state.sel = null; renderMap(d); renderFocus(d); return; }
  if (t.closest('[data-map-close]')) { state.mapOpen = false; store.set('study-map-open', '0'); renderStudyBits(); return; }
  if (t.closest('[data-play]')) { togglePlay(); return; }
  const zm = t.closest('[data-zoom]');
  if (zm) { state.zoom = Math.min(1.6, Math.max(0.5, +(state.zoom + 0.1 * +zm.dataset.zoom).toFixed(1))); store.set('study-zoom', state.zoom);
    renderMap(d); if (state.mapOpen) renderMapInto(document.getElementById('mapSide'), d, true); return; }
  const gl = t.closest('[data-gen-links]');
  if (gl) {
    gl.disabled = true; gl.textContent = 'Connecting…';
    const r = await post('/api/links', { subject: d.name }).catch(e => ({ error: e.message }));
    if (r.error) alertLine(r.error);
    await reload();
    return;
  }
  const st = t.closest('[data-study]');
  if (st) { const topic = d.topics[+st.dataset.topicI].topic; startStudy(d.name, topic, prompts[st.dataset.study](d.name, topic)); return; }
  const dr = t.closest('[data-draw]');
  if (dr) { const cur = currentTopic(); if (cur) send(prompts[dr.dataset.draw](d.name, cur.topic)); return; }
  const step = t.closest('[data-topic]'); if (step) { setTopic(d.name, step.dataset.topic); renderStudyBits(); return; }
  const flip = t.closest('[data-flip]');
  if (flip) { const i = +flip.dataset.flip; state.flipped.has(i) ? state.flipped.delete(i) : state.flipped.add(i); renderMistakes(d); return; }
  const node = t.closest('[data-node]');
  if (node) {
    const i = +node.dataset.node;
    if (node.closest('#mapSide')) { setTopic(d.name, d.topics[i].topic); renderStudyBits(); return; }
    state.sel = state.sel === i ? null : i;
    renderMap(d); renderFocus(d);
    if (state.sel !== null) document.getElementById('focus').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
});
document.getElementById('quick').addEventListener('click', e => {
  const b = e.target.closest('[data-cmd]'); if (!b) return;
  send(b.dataset.cmd === 'status' ? '/status' : `/${b.dataset.cmd} ${state.current ?? ''}`.trim());
});

// The divider: drag or arrow keys, tutor width 300px to 70% of the Study area, remembered.
(() => {
  const div = document.getElementById('divider'), tutor = document.getElementById('tutor'), area = document.getElementById('view-study');
  const setW = w => {
    const total = area.clientWidth, cl = Math.round(Math.min(Math.max(w, 300), total * 0.7));
    tutor.style.flex = `0 0 ${cl}px`; store.set('study-tutor-w', cl);
    div.setAttribute('aria-valuenow', cl);
  };
  div.addEventListener('pointerdown', e => {
    div.setPointerCapture(e.pointerId); div.classList.add('drag');
    const left = tutor.getBoundingClientRect().left;
    const move = ev => setW(ev.clientX - left);
    const up = () => { div.classList.remove('drag'); div.removeEventListener('pointermove', move); div.removeEventListener('pointerup', up); };
    div.addEventListener('pointermove', move); div.addEventListener('pointerup', up);
  });
  div.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); setW(tutor.getBoundingClientRect().width + (e.key === 'ArrowRight' ? 24 : -24)); }
  });
  window.addEventListener('resize', () => { if (state.view === 'study') layoutStudy(); });
})();

document.getElementById('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  store.set('study-theme', root.dataset.theme);
});
{ const t = store.get('study-theme'); if (t) document.documentElement.dataset.theme = t; }
// The tutor edits the files from the terminal too: re-read them when the page gets focus.
window.addEventListener('focus', () => { if (!state.playing) reload(); });
const savedView = store.get('study-view');
setView(['plan', 'study', 'reflect'].includes(savedView) ? savedView : 'plan');
reload();
</script>
